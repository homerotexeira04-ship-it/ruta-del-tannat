<!doctype html>
<html lang="es" style="overflow:hidden; margin:0">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1080, height=1080" />
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@hyperframes/core/dist/hyperframe.runtime.iife.js"></script>
  <style>
    @font-face { font-family: "Playfair Display"; font-weight: 400 900; font-style: normal; font-display: block; src: url(fonts/playfair-display-latin.woff2) format("woff2"); }
    @font-face { font-family: "Playfair Display"; font-weight: 400 900; font-style: italic; font-display: block; src: url(fonts/playfair-display-italic-latin.woff2) format("woff2"); }
    @font-face { font-family: "Plus Jakarta Sans"; font-weight: 200 800; font-style: normal; font-display: block; src: url(fonts/plus-jakarta-sans-latin.woff2) format("woff2"); }

    :root { --bg: #1D060D; --wine: #4A1525; --wine-light: #722F37; --gold: #C5A059; --gold-light: #DFCA9D; --cream: #FDFBF7; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1080px; height: 1080px; overflow: hidden; background: var(--bg); }

    .scene { position: absolute; inset: 0; width: 1080px; height: 1080px; overflow: hidden; }
    /* El borde del cuadro queda en --bg liso: el video se muestra con "contain" sobre un fondo igual */
    .glow { position: absolute; left: 540px; top: 400px; width: 760px; height: 760px; margin: -380px 0 0 -380px; border-radius: 50%;
      background: radial-gradient(circle, rgba(114,47,55,.55) 0%, rgba(74,21,37,.35) 35%, rgba(29,6,13,0) 70%); }

    .stream { position: absolute; left: 534px; top: 0; width: 12px; height: 290px; border-radius: 6px;
      background: linear-gradient(to bottom, rgba(114,47,55,0), var(--wine-light) 30%, var(--wine)); }

    .disc { position: absolute; left: 540px; top: 400px; width: 330px; height: 330px; margin: -165px 0 0 -165px; border-radius: 50%; overflow: hidden;
      box-shadow: inset 0 0 60px rgba(0,0,0,.55); }
    .swirl { position: absolute; inset: -20%; border-radius: 50%; filter: blur(22px);
      background: conic-gradient(from 0deg, #3a0f1c, #722F37, #4A1525, #2a0912, #6a2733, #4A1525, #3a0f1c); }
    .depth { position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle, rgba(29,6,13,0) 45%, rgba(29,6,13,.55) 100%); }
    .sheen { position: absolute; inset: 0; border-radius: 50%;
      background: radial-gradient(circle at 34% 30%, rgba(223,202,157,.35), rgba(223,202,157,0) 32%); }

    .ripple { position: absolute; left: 540px; top: 400px; width: 330px; height: 330px; margin: -165px 0 0 -165px; border-radius: 50%; border: 2px solid rgba(197,160,89,.55); }
    svg.ring { position: absolute; left: 540px; top: 400px; width: 400px; height: 400px; margin: -200px 0 0 -200px; overflow: visible; }

    .title { position: absolute; left: 0; right: 0; top: 650px; text-align: center; font-family: "Playfair Display", Georgia, serif; font-weight: 700; font-size: 92px; line-height: 1; color: var(--cream); letter-spacing: -.01em; }
    .title .ch { display: inline-block; }
    .shine { position: absolute; left: 0; right: 0; top: 640px; height: 120px; pointer-events: none; mix-blend-mode: overlay;
      background: linear-gradient(100deg, rgba(255,240,205,0) 40%, rgba(255,240,205,.9) 50%, rgba(255,240,205,0) 60%); }
    .rule { position: absolute; left: 390px; width: 300px; top: 786px; height: 2px; background: var(--gold); transform-origin: 50% 50%; }
    .sub { position: absolute; left: 0; right: 0; top: 818px; text-align: center; font-family: "Plus Jakarta Sans", sans-serif; font-weight: 600; font-size: 34px; letter-spacing: .34em; color: var(--gold); padding-left: .42em; }
  </style>
</head>
<body>
  <div id="main" data-composition-id="main" data-width="1080" data-height="1080" data-start="0" data-duration="4.2" data-fps="30">
    <div class="scene clip" id="s1" data-start="0" data-duration="4.2" data-track-index="0">
      <div class="glow" id="glow"></div>
      <div class="ripple" id="r1"></div>
      <div class="ripple" id="r2"></div>
      <div class="stream" id="stream"></div>
      <div class="disc" id="disc"><div class="swirl" id="swirl"></div><div class="depth"></div><div class="sheen"></div></div>
      <svg class="ring" viewBox="0 0 400 400" aria-hidden="true">
        <circle id="ring" cx="200" cy="200" r="190" fill="none" stroke="#C5A059" stroke-width="2.5" stroke-dasharray="1194" stroke-dashoffset="1194" transform="rotate(-90 200 200)" />
        <circle id="ring2" cx="200" cy="200" r="178" fill="none" stroke="#DFCA9D" stroke-opacity=".45" stroke-width="1" stroke-dasharray="1119" stroke-dashoffset="1119" transform="rotate(90 200 200)" />
      </svg>
      <h1 class="title" id="title"></h1>
      <div class="shine" id="shine"></div>
      <div class="rule" id="rule"></div>
      <p class="sub" id="sub">SALTO · URUGUAY · 1874</p>
    </div>
  </div>

  <script>
    // Título partido en letras para la entrada escalonada
    var t = document.getElementById("title");
    "La Ruta del Tannat".split("").forEach(function (c) {
      var s = document.createElement("span"); s.className = "ch"; s.textContent = c === " " ? " " : c; t.appendChild(s);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    // 0–1.2 s: el vino cae y se arremolina
    tl.from("#glow", { scale: .6, autoAlpha: 0, duration: 1.6, ease: "sine.out" }, 0);
    tl.fromTo("#stream", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: .5, ease: "power2.in" }, .1);
    tl.to("#stream", { scaleY: 0, transformOrigin: "50% 100%", duration: .45, ease: "power2.out" }, .65);
    tl.fromTo("#disc", { scale: 0 }, { scale: 1, duration: 1.1, ease: "expo.out" }, .5);
    tl.fromTo("#swirl", { rotation: 0 }, { rotation: 300, duration: 3.3, ease: "power2.out" }, .5);
    tl.set("#r1, #r2", { autoAlpha: 0 }, 0);
    tl.fromTo("#r1", { scale: .9, autoAlpha: .9 }, { scale: 1.45, autoAlpha: 0, duration: 1.1, ease: "power2.out", immediateRender: false }, .6);
    tl.fromTo("#r2", { scale: .9, autoAlpha: .7 }, { scale: 1.75, autoAlpha: 0, duration: 1.4, ease: "power2.out", immediateRender: false }, .8);

    // 1.2–2.2 s: el aro dorado se dibuja
    tl.to("#ring", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 1.1);
    tl.to("#ring2", { strokeDashoffset: 0, duration: 1.1, ease: "sine.inOut" }, 1.3);

    // 2.0–3.2 s: título, filete y subtítulo
    tl.from("#title .ch", { y: 46, autoAlpha: 0, duration: .7, ease: "power3.out", stagger: { each: .035, from: "start" } }, 1.9);
    tl.fromTo("#rule", { scaleX: 0 }, { scaleX: 1, duration: .7, ease: "expo.out" }, 2.45);
    tl.from("#sub", { autoAlpha: 0, y: 14, duration: .8, ease: "power2.out" }, 2.6);

    // 3.0–3.6 s: un brillo pasa una vez por el título; desde 3.8 todo quieto
    tl.fromTo("#shine", { xPercent: -70, autoAlpha: 0 }, { xPercent: 70, autoAlpha: 1, duration: .6, ease: "sine.inOut" }, 3.0);
    tl.to("#shine", { autoAlpha: 0, duration: .15 }, 3.6);
    tl.set({}, {}, 4.2);

    window.__timelines["main"] = tl;
  </script>
</body>
</html>
